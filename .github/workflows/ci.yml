---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  merge_group:
  pull_request:
    branches:
      - "main"

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Test and verify OpenAPI conformance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun ci

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun test

      - name: Fake-call every endpoint in every API snapshot
        run: bun run conformance:all

      - name: Smoke-test built CLI
        run: bun bin/langfuse-cli.mjs --help

      - name: Verify version consistency and changelog
        run: bun run release:check

      - name: Smoke-test completion callback
        run: |
          bun bin/langfuse-cli.mjs completion zsh > /dev/null
          bun bin/langfuse-cli.mjs __complete api prompts | grep -q '^list'

      - name: Build and smoke-test the standalone executable
        run: |
          bun run compile
          ./dist/langfuse-cli --version
          ./dist/langfuse-cli api help > /dev/null
